<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 40" fill="none">
  <!-- Shrimp icon in rounded square -->
  <rect x="0" y="4" width="32" height="32" rx="8" fill="white"/>
  <!-- Shrimp body — curved C shape -->
  <path d="M10 14 Q10 24 16 28 Q22 32 26 26" fill="none" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="0.8s" begin="0s" fill="freeze"/>
  </path>
  <!-- Tail fan -->
  <path d="M26 26 L29 29 M26 26 L30 26 M26 26 L28 23" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <!-- Antenna -->
  <path d="M10 14 Q6 8 4 6" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <path d="M10 14 Q8 10 9 6" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <!-- Eye -->
  <circle cx="12" cy="13" r="1.6" fill="#1a1a1a" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <animate attributeName="r" values="1.6;2;1.6" dur="2.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <!-- Body segments -->
  <path d="M13 18 Q14 17 15 18" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <path d="M16 21 Q17 20 18 21" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <path d="M20 24 Q21 23 22 24" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <text x="40" y="28" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700" fill="white">Content Shrimp</text>
</svg>
