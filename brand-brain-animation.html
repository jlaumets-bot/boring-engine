document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 v.capS }};\"><span style=\"font-weight:900; font-size:17px; color:#141414;\">04<\u002Fspan><div><div style=\"font-weight:800; font-size:21px; line-height:1.15;\">Posted<\u002Fdiv><div style=\"font-size:17px; color:#141414; font-weight:500; line-height:1.3; margin-top:3px;\">Tap done and it ships — idea to live, closed.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; gap:11px; opacity:{{ v.capD }};\"><span style=\"font-weight:900; font-size:17px; color:#141414;\">05<\u002Fspan><div><div style=\"font-weight:800; font-size:21px; line-height:1.15;\">Everything you get<\u002Fdiv><div style=\"font-size:17px; color:#141414; font-weight:500; line-height:1.3; margin-top:3px;\">Remix, research, blog, viral lab, memes &amp; more.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { t: 0 };\n  componentDidMount() {\n    this.t0 = performance.now();\n    const loop = (now) => {\n      this.setState({ t: (now - this.t0) % this.TOTAL });\n      this._raf = requestAnimationFrame(loop);\n    };\n    this._raf = requestAnimationFrame(loop);\n  }\n  componentWillUnmount() { cancelAnimationFrame(this._raf); }\n  get TOTAL() { return 30500; }\n\n  renderVals() {\n    const t = this.state.t;\n    const cl = (x) => x < 0 ? 0 : x > 1 ? 1 : x;\n    const P = (at, dur) => cl((t - at) / dur);\n    const E = (x) => 1 - Math.pow(1 - x, 3);\n    const rev = (at, dur, y) => { const x = E(P(at, dur || 460)); return { o: x, t: `translateY(${((1 - x) * (y == null ? 10 : y)).toFixed(1)}px)` }; };\n    const chk = (at) => { const r = P(at, 340); const x = E(r); return { o: x, s: (0.35 + 0.65 * x).toFixed(2) }; };\n    const bump = (at, dur) => { const r = P(at, dur); return r <= 0 || r >= 1 ? 0 : Math.sin(r * Math.PI); };\n    const win = (a, b) => t >= a && t < b;\n    const scn = (a, b) => { const f = 380; const i = cl((t - a) / f); const o = 1 - cl((t - (b - f)) / f); const on = t >= a && t < b; const op = on ? Math.min(i, o) : 0; return { o: op.toFixed(3), s: (0.985 + 0.015 * op).toFixed(3) }; };\n\n    const v = {};\n    // scenes\n    const S1 = scn(0, 6800), S2 = scn(7000, 13800), S3 = scn(14000, 19800), S5 = scn(20000, 22900), S4 = scn(23100, 30000);\n    v.s1o = S1.o; v.s1s = S1.s; v.s2o = S2.o; v.s2s = S2.s; v.s3o = S3.o; v.s3s = S3.s; v.s5o = S5.o; v.s5s = S5.s; v.s4o = S4.o; v.s4s = S4.s;\n\n    // scene 1 : ingest\n    const u = rev(300, 400); v.urlO = u.o.toFixed(3); v.urlT = u.t;\n    const rows1 = [900, 1500, 2100, 2700];\n    rows1.forEach((at, i) => { const r = rev(at, 420); const c = chk(at + 350); v['r' + (i + 1) + 'o'] = r.o.toFixed(3); v['r' + (i + 1) + 't'] = r.t; v['c' + (i + 1) + 'o'] = c.o.toFixed(3); v['c' + (i + 1) + 's'] = c.s; });\n    v.prog = (E(P(1000, 2400)) * 100).toFixed(0) + '%';\n    const rdy = rev(3700, 500, 12); v.readyO = rdy.o.toFixed(3); v.readyT = rdy.t;\n\n    // scene 2 : generate\n    const qp = rev(7000, 420); v.qpO = qp.o.toFixed(3); v.qpT = qp.t;\n    v.genS = (1 - 0.035 * bump(8000, 320)).toFixed(3);\n    v.tapO = win(7500, 8100) ? 0.5 : 0; v.tapS = (0.7 + 0.5 * P(7500, 500)).toFixed(2);\n    const rp = P(8000, 700); v.ripO = win(8000, 8700) ? (1 - rp).toFixed(2) : 0; v.ripS = (rp * 3.2).toFixed(2);\n    v.shO = win(8100, 9100) ? 1 : 0; v.shX = (-120 + P(8100, 1000) * 400).toFixed(0) + '%';\n    const res = rev(9300, 540, 46); v.resO = res.o.toFixed(3); v.resT = res.t;\n    v.hookO = E(P(9900, 420)).toFixed(3);\n    const l1 = rev(10500, 420, 6), l2 = rev(11100, 420, 6);\n    v.l1o = l1.o.toFixed(3); v.l1t = l1.t; v.l2o = l2.o.toFixed(3); v.l2t = l2.t;\n\n    // scene 3 : learn\n    const mod = rev(14000, 520, 60); v.modO = mod.o.toFixed(3); v.modT = mod.t;\n    const chip = (fillAt, ripAt, key) => {\n      v[key + 'Bg'] = t >= fillAt ? '#E0D0F5' : '#ffffff';\n      const r = P(ripAt, 640); v[key === 'ca' ? 'raO' : key === 'cb' ? 'rbO' : 'rcO'] = win(ripAt, ripAt + 640) ? (1 - r).toFixed(2) : 0;\n      v[key === 'ca' ? 'raS' : key === 'cb' ? 'rbS' : 'rcS'] = (r * 3).toFixed(2);\n    };\n    chip(15000, 14800, 'ca'); chip(15800, 15600, 'cb'); chip(16600, 16400, 'cc');\n    v.mBrainBg = win(17000, 17520) ? '#CDB4F0' : '#E0D0F5'; v.mBrainS = (1 + 0.3 * bump(17000, 440)).toFixed(3);\n    const st = rev(17500, 460, 10); v.stO = st.o.toFixed(3); v.stT = st.t;\n    v.saveBg = win(18300, 18800) ? '#CDB4F0' : '#E0D0F5'; v.saveS = (1 - 0.03 * bump(18300, 320)).toFixed(3);\n\n    // scene 4 : scope\n    const sc = rev(23200, 420); v.scO = sc.o.toFixed(3); v.scT = sc.t;\n    for (let i = 0; i < 6; i++) { const r = rev(23500 + i * 250, 420, 12); v['t' + (i + 1) + 'o'] = r.o.toFixed(3); v['t' + (i + 1) + 't'] = r.t; }\n    v.hiO = win(25600, 29100) ? 1 : 0; v.hiTop = (E(P(25600, 3100)) * (5 * 62)).toFixed(0) + 'px';\n\n    // scene 5 : ship / posted\n    const ph = rev(20000, 420); v.pHeadO = ph.o.toFixed(3); v.pHeadT = ph.t;\n    const pcd = rev(20050, 460, 14); v.pCardO = pcd.o.toFixed(3); v.pCardT = pcd.t;\n    v.pTapO = win(20600, 21100) ? 0.5 : 0; v.pTapS = (0.7 + 0.5 * P(20600, 450)).toFixed(2);\n    v.pBtnBg = win(20800, 21200) ? '#CDB4F0' : '#E0D0F5'; v.pBtnS = (1 - 0.04 * bump(20800, 300)).toFixed(3);\n    const pr2 = P(20800, 650); v.pRipO = win(20800, 21450) ? (1 - pr2).toFixed(2) : 0; v.pRipS = (pr2 * 3).toFixed(2);\n    v.pPostedO = E(P(21200, 420)).toFixed(3); v.pCheckS = (0.3 + 0.7 * E(P(21350, 420))).toFixed(2);\n    const psw = E(P(21350, 360)); v.pF1o = (1 - psw).toFixed(2); v.pF0o = psw.toFixed(2); v.pD0o = (1 - psw).toFixed(2); v.pD1o = psw.toFixed(2); v.pDoneTabBg = t >= 21400 ? '#E0D0F5' : '#ffffff';\n\n    // bottom nav follow\n    const act = t < 7000 ? '' : t < 14000 ? 'quick' : t < 20000 ? 'ideas' : t < 23000 ? 'pipeline' : 'more';\n    v.navQ = act === 'quick' ? '#1A1A1A' : '#b8b1a2';\n    v.navI = act === 'ideas' ? '#1A1A1A' : '#b8b1a2';\n    v.navP = act === 'pipeline' ? '#1A1A1A' : '#b8b1a2';\n    v.navM = act === 'more' ? '#1A1A1A' : '#b8b1a2';\n\n    // side captions highlight\n    v.capA = (t < 7000 ? 1 : 0.4).toFixed(2);\n    v.capB = (t >= 7000 && t < 14000 ? 1 : 0.4).toFixed(2);\n    v.capC = (t >= 14000 && t < 20000 ? 1 : 0.4).toFixed(2);\n    v.capS = (t >= 20000 && t < 23100 ? 1 : 0.4).toFixed(2);\n    v.capD = (t >= 23100 ? 1 : 0.4).toFixed(2);\n\n    return { v };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
